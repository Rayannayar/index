<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat</title>
</head>
<body>
    <!-- Start of Tawk.to Script -->
    <script type="text/javascript">
        // Fonction pour récupérer l'email depuis l'URL
        function getQueryParams(param) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);  // retourne la valeur du paramètre
        }

        // Récupérer l'email de l'URL dynamique
        var userEmail = getQueryParams("email");

        // Configurer le widget Tawk.to avec l'email récupéré
        var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
        (function() {
            var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
            s1.async = true;
            s1.src = 'https://embed.tawk.to/67ac6dff3a842732607dc0b2/1ijsutnto';
            s1.charset = 'UTF-8';
            s1.setAttribute('crossorigin', '*');
            s0.parentNode.insertBefore(s1, s0);

            // Une fois le script Tawk chargé, envoyer l'email à Tawk
            s1.onload = function() {
                if(userEmail) {
                    Tawk_API.setAttributes({
                        email: userEmail
                    });
                }
            };
        })();
    </script>
    <!-- End of Tawk.to Script -->
</body>
</html>
